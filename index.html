<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KARMA ARKADE — KOMING SOON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Audiowide&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050014;
      --pink: #ff2bd6;
      --cyan: #00f6ff;
      --violet: #9b5cff;
      --yellow: #ffe566;
      --hot: #ff4d8d;
      --grid: rgba(0, 246, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      font-family: "Orbitron", sans-serif;
    }

    body {
      position: relative;
    }

    .stars,
    .stars-2,
    .nebula,
    .scanlines,
    .vignette,
    .grid-floor {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .nebula {
      background:
        radial-gradient(ellipse at 20% 15%, rgba(155, 92, 255, 0.28), transparent 42%),
        radial-gradient(ellipse at 80% 10%, rgba(255, 43, 214, 0.18), transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 246, 255, 0.16), transparent 50%),
        radial-gradient(ellipse at 50% 40%, rgba(8, 0, 40, 0.4), transparent 60%);
      z-index: 0;
    }

    .stars {
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff, transparent),
        radial-gradient(1px 1px at 28% 68%, #cff, transparent),
        radial-gradient(1.5px 1.5px at 44% 18%, #fff, transparent),
        radial-gradient(1px 1px at 61% 81%, #fdf, transparent),
        radial-gradient(1px 1px at 73% 36%, #fff, transparent),
        radial-gradient(2px 2px at 88% 12%, #aff, transparent),
        radial-gradient(1px 1px at 6% 88%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 91% 72%, #fff, transparent),
        radial-gradient(1px 1px at 33% 44%, #faf, transparent),
        radial-gradient(1px 1px at 52% 9%, #fff, transparent);
      animation: twinkle 4.5s ease-in-out infinite;
      z-index: 1;
    }

    .stars-2 {
      background-image:
        radial-gradient(1px 1px at 18% 40%, #9ff, transparent),
        radial-gradient(1px 1px at 70% 58%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40% 90%, #fcf, transparent),
        radial-gradient(1px 1px at 95% 30%, #fff, transparent),
        radial-gradient(1px 1px at 8% 8%, #cff, transparent);
      opacity: 0.7;
      animation: twinkle 6.2s ease-in-out infinite reverse;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .grid-floor {
      top: auto;
      height: 42vh;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      transform: perspective(420px) rotateX(68deg);
      transform-origin: top;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 90%);
      animation: grid-scroll 8s linear infinite;
      z-index: 1;
    }

    @keyframes grid-scroll {
      from { background-position: 0 0; }
      to { background-position: 0 48px; }
    }

    .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      mix-blend-mode: multiply;
      z-index: 8;
    }

    .vignette {
      box-shadow: inset 0 0 180px 40px rgba(0, 0, 0, 0.72);
      z-index: 7;
    }

    .wrap {
      position: relative;
      z-index: 4;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 28px;
    }

    .hud {
      width: min(720px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 2px solid var(--cyan);
      box-shadow:
        0 0 12px var(--cyan),
        inset 0 0 18px rgba(0, 246, 255, 0.12);
      background: rgba(4, 0, 24, 0.72);
      margin-bottom: 18px;
    }

    .hud-label,
    .mood-chip {
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
    }

    .counter {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(16px, 4vw, 22px);
      color: var(--yellow);
      text-shadow:
        0 0 8px #ffb800,
        0 0 18px rgba(255, 184, 0, 0.6);
    }

    .mood-chip {
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
      text-align: right;
    }

    .brand {
      text-align: center;
      margin-bottom: 6px;
    }

    .brand h1 {
      font-family: "Audiowide", "Orbitron", sans-serif;
      font-size: clamp(28px, 8vw, 72px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow:
        0 0 8px var(--pink),
        0 0 18px var(--pink),
        0 0 42px var(--violet),
        3px 3px 0 #3a0066;
    }

    .brand h1 .k {
      color: var(--cyan);
      text-shadow:
        0 0 8px var(--cyan),
        0 0 22px var(--cyan),
        3px 3px 0 #003344;
    }

    .soon {
      margin-top: 10px;
      font-family: "Press Start 2P", monospace;
      font-size: clamp(9px, 2.4vw, 14px);
      letter-spacing: 0.35em;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
      animation: blink-soon 1.4s steps(2, end) infinite;
    }

    @keyframes blink-soon {
      50% { opacity: 0.35; }
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .cat-btn {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      position: relative;
      width: min(78vw, 420px);
      aspect-ratio: 1;
      filter:
        drop-shadow(0 0 16px rgba(255, 43, 214, 0.45))
        drop-shadow(0 0 28px rgba(0, 246, 255, 0.25));
      animation: floaty 3.6s ease-in-out infinite;
      transition: transform 0.12s ease;
    }

    .cat-btn:hover {
      transform: scale(1.03);
    }

    .cat-btn:active {
      transform: scale(0.96);
    }

    .cat-btn.bonk {
      animation: bonk 0.28s ease;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes bonk {
      0% { transform: scale(1) rotate(0); }
      30% { transform: scale(0.9) rotate(-4deg); }
      60% { transform: scale(1.06) rotate(3deg); }
      100% { transform: scale(1) rotate(0); }
    }

    svg.cat {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .hint {
      margin-top: 8px;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .footer {
      margin-top: 16px;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      color: rgba(155, 92, 255, 0.9);
      letter-spacing: 0.2em;
      text-shadow: 0 0 8px var(--violet);
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
      animation: spark 560ms ease-out forwards;
    }

    @keyframes spark {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    @media (max-width: 520px) {
      .hud {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .mood-chip {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="nebula"></div>
  <div class="stars"></div>
  <div class="stars-2"></div>
  <div class="grid-floor"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="wrap">
    <div class="hud">
      <div>
        <div class="hud-label">PLAYER 1 • CLICKS</div>
        <div class="counter" id="counter">000000</div>
      </div>
      <div class="mood-chip" id="moodLabel">MOOD: CUTE</div>
    </div>

    <header class="brand">
      <h1><span class="k">K</span>ARMA <span class="k">AR</span>K<span class="k">A</span>DE</h1>
      <div class="soon">KOMING SOON</div>
    </header>

    <div class="stage">
      <button class="cat-btn" id="catBtn" aria-label="Pet the arcade cat" title="Pet the cat">
        <svg class="cat" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.2" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <g id="face" filter="url(#neon)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
            <rect id="browL" x="118" y="132" width="46" height="16" rx="8" fill="#ffffff" stroke="none" />
            <rect id="browR" x="236" y="132" width="46" height="16" rx="8" fill="#ffffff" stroke="none" />

            <circle id="eyeL" cx="141" cy="210" r="52" stroke-width="22" fill="#050014" />
            <circle id="eyeR" cx="259" cy="210" r="52" stroke-width="22" fill="#050014" />

            <g id="hearts" opacity="0">
              <path d="M129 206 c0-10 12-16 18-8 c6-8 18-2 18 8 c0 14 -18 24 -18 24 s-18-10 -18-24z" fill="#ff2bd6" stroke="none" />
              <path d="M247 206 c0-10 12-16 18-8 c6-8 18-2 18 8 c0 14 -18 24 -18 24 s-18-10 -18-24z" fill="#ff2bd6" stroke="none" />
            </g>

            <g id="lids" opacity="0">
              <rect id="lidL" x="86" y="198" width="110" height="26" rx="13" fill="#ffffff" stroke="none" />
              <rect id="lidR" x="204" y="198" width="110" height="26" rx="13" fill="#ffffff" stroke="none" />
            </g>

            <ellipse id="nose" cx="200" cy="258" rx="8" ry="6.5" fill="#ffffff" stroke="none" />

            <path id="mouth" d="M186 276 Q200 288 214 276" stroke-width="6" />

            <g id="whiskers" stroke-width="5">
              <line x1="86" y1="250" x2="44" y2="242" />
              <line x1="88" y1="264" x2="46" y2="272" />
              <line x1="314" y1="250" x2="356" y2="242" />
              <line x1="312" y1="264" x2="354" y2="272" />
            </g>
          </g>
        </svg>
      </button>
      <p class="hint">TAP THE CAT • MOOD SHIFTS EVERY 3 HITS</p>
    </div>

    <div class="footer">INSERT COIN • EST. 2026 • 1UP</div>
  </div>

  <script>
    (function () {
      const moods = [
        { name: "CUTE", brow: 0, browY: 132, lids: 0, hearts: 0, mouth: "M186 276 Q200 288 214 276", eyeR: 52, stroke: 22 },
        { name: "UNAMUSED", brow: 16, browY: 138, lids: 1, hearts: 0, mouth: "M188 280 L212 280", eyeR: 52, stroke: 18 },
        { name: "MAD", brow: 22, browY: 128, lids: 0, hearts: 0, mouth: "M186 286 Q200 272 214 286", eyeR: 52, stroke: 22 },
        { name: "HAPPY", brow: -10, browY: 126, lids: 1, hearts: 0, mouth: "M176 270 Q200 302 224 270", eyeR: 52, stroke: 20 },
        { name: "SHOOK", brow: -6, browY: 118, lids: 0, hearts: 0, mouth: "M194 276 a8 8 0 1 0 0.1 0", eyeR: 60, stroke: 18 },
        { name: "LOVE", brow: -8, browY: 126, lids: 0, hearts: 1, mouth: "M182 274 Q200 296 218 274", eyeR: 52, stroke: 16 }
      ];

      let clicks = 0;
      let moodIndex = 0;

      const counterEl = document.getElementById("counter");
      const moodEl = document.getElementById("moodLabel");
      const btn = document.getElementById("catBtn");
      const browL = document.getElementById("browL");
      const browR = document.getElementById("browR");
      const lids = document.getElementById("lids");
      const hearts = document.getElementById("hearts");
      const mouth = document.getElementById("mouth");
      const eyeL = document.getElementById("eyeL");
      const eyeR = document.getElementById("eyeR");

      function pad(n) {
        return String(n).padStart(6, "0");
      }

      function applyMood(i) {
        const m = moods[i];
        browL.setAttribute("transform", "rotate(" + (-m.brow) + " 141 140)");
        browR.setAttribute("transform", "rotate(" + m.brow + " 259 140)");
        browL.setAttribute("y", m.browY);
        browR.setAttribute("y", m.browY);
        lids.setAttribute("opacity", m.lids);
        hearts.setAttribute("opacity", m.hearts);
        mouth.setAttribute("d", m.mouth);
        eyeL.setAttribute("r", m.eyeR);
        eyeR.setAttribute("r", m.eyeR);
        eyeL.setAttribute("stroke-width", m.stroke);
        eyeR.setAttribute("stroke-width", m.stroke);
        moodEl.textContent = "MOOD: " + m.name;
      }

      function beep(freq, dur, type) {
        try {
          const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || "square";
          osc.frequency.value = freq;
          gain.gain.value = 0.05;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
          osc.stop(ctx.currentTime + dur);
        } catch (e) {}
      }

      function sparks(x, y) {
        const colors = ["#ff2bd6", "#00f6ff", "#ffe566", "#9b5cff"];
        for (let i = 0; i < 10; i++) {
          const s = document.createElement("span");
          s.className = "spark";
          const angle = (Math.PI * 2 * i) / 10;
          const dist = 28 + Math.random() * 46;
          s.style.left = x + "px";
          s.style.top = y + "px";
          s.style.background = colors[i % colors.length];
          s.style.boxShadow = "0 0 8px " + colors[i % colors.length];
          s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          document.body.appendChild(s);
          setTimeout(function () { s.remove(); }, 580);
        }
      }

      applyMood(0);

      btn.addEventListener("click", function (ev) {
        clicks += 1;
        counterEl.textContent = pad(clicks);

        btn.classList.remove("bonk");
        void btn.offsetWidth;
        btn.classList.add("bonk");

        sparks(ev.clientX, ev.clientY);

        if (clicks % 3 === 0) {
          moodIndex = (moodIndex + 1) % moods.length;
          applyMood(moodIndex);
          beep(220, 0.12, "sawtooth");
          setTimeout(function () { beep(330, 0.14, "square"); }, 90);
        } else {
          beep(480 + (clicks % 5) * 40, 0.07, "square");
        }
      });
    })();
  </script>
</body>
</html>
